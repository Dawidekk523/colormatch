<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>colormatch — viewport harness</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        background: #e9e9e9;
        font: 12px/1.3 ui-sans-serif, system-ui, sans-serif;
      }
      #caption {
        padding-bottom: 6px;
        color: #444;
      }
      #window {
        overflow: hidden;
        background: #fff;
        border: 1px solid #c9c9c9;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The browser tool cannot resize its window, so the width lives here: a
         media query inside the iframe sees the iframe's width. The iframe is
         made tall enough to render the whole page at once and then shifted up
         behind a clipping window, which is the only way to reach content below
         the fold — the frame is cross-origin, so it cannot be scrolled. -->
    <div id="caption"></div>
    <div id="window"><iframe id="frame" title="preview"></iframe></div>
    <script>
      const q = new URLSearchParams(location.search);
      const path = q.get('path') ?? '/';
      const base = q.get('base') ?? 'http://localhost:4321';
      const width = Number(q.get('w') ?? 390);
      const offset = Number(q.get('offset') ?? 0);
      const windowHeight = Number(q.get('h') ?? 740);
      const tall = Number(q.get('tall') ?? 6000);

      const frame = document.getElementById('frame');
      frame.width = width;
      frame.height = tall;
      frame.style.marginTop = `-${offset}px`;
      frame.src = base + path;

      const box = document.getElementById('window');
      box.style.width = `${width}px`;
      box.style.height = `${windowHeight}px`;

      document.getElementById('caption').textContent =
        `${path} — ${width}px wide, showing ${offset}–${offset + windowHeight}px down the page`;
    </script>
  </body>
</html>
