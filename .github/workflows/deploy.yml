name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without an empty commit.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run functions:build

      # Applies only migration files the remote database has not recorded yet.
      # Every migration so far is additive (IF NOT EXISTS); a destructive one
      # should be run by hand, not by a push.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      # Uploads dist/ and compiles functions/ into the existing direct-upload
      # project. Bindings and secrets live on the project, not here. --branch main
      # is the production branch; any other value makes a preview deployment.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name colormatch --branch main --commit-hash ${{ github.sha }}
